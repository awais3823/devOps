name: Simplified CI/CD

on:
  release:
    types: [created]  # Changed from 'published' to 'created'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # Or 'self-hosted' if using self-hosted runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}  # Fixed: consistent name
          password: ${{ secrets.DOCKERHUB_PASSWORD }}   # Fixed: consistent name

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./Project/nginx-nodejs-redis/web
          file: ./Project/nginx-nodejs-redis/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-web:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-web:latest

      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./Project/nginx-nodejs-redis/nginx
          file: ./Project/nginx-nodejs-redis/nginx/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-nginx:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-nginx:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          # Use printf to preserve formatting
          printf '%s' "$KUBECONFIG" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          
          # Verify config is valid
          if ! grep -q "apiVersion:" $HOME/.kube/config; then
            echo "Error: Invalid kubeconfig"
            exit 1
          fi
          
          # Update images in the cluster
          TAG=${{ github.event.release.tag_name }}
          NAMESPACE="nginx-nodejs-redis"
          
          # Verify cluster connection
          kubectl cluster-info
          
          # Update deployments
          kubectl set image deployment/web web=${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-web:$TAG -n $NAMESPACE
          kubectl set image deployment/nginx nginx=${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-nginx:$TAG -n $NAMESPACE
          
          # Verify rollout
          kubectl rollout status deployment/web -n $NAMESPACE --timeout=300s
          kubectl rollout status deployment/nginx -n $NAMESPACE --timeout=300s
          
          # Show status
          kubectl get pods -n $NAMESPACE
