name: CI/CD Pipeline

on:
  release:
    types: [created]

env:
  DOCKER_REGISTRY: docker.io
  KUBERNETES_NAMESPACE: nginx-nodejs-redis

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx for advanced features and caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Extract release version from GitHub release tag
      - name: Extract release version
        id: release_version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present (e.g., v1.0.0 -> 1.0.0)
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Step 4.5: Debug - List directory structure
      - name: Debug - List directory structure
        run: |
          echo "=== Current directory ==="
          pwd
          echo ""
          echo "=== Root directory contents ==="
          ls -la
          echo ""
          echo "=== Project directory ==="
          ls -la Project/ || echo "Project directory not found"
          echo ""
          echo "=== nginx-nodejs-redis directory ==="
          ls -la Project/nginx-nodejs-redis/ || echo "nginx-nodejs-redis directory not found"
          echo ""
          echo "=== web directory ==="
          ls -la Project/nginx-nodejs-redis/web/ || echo "web directory not found"
          echo ""
          echo "=== nginx directory ==="
          ls -la Project/nginx-nodejs-redis/nginx/ || echo "nginx directory not found"

      # Step 5: Build and push web image
      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: ./Project/nginx-nodejs-redis/web
          file: ./Project/nginx-nodejs-redis/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-web:${{ steps.release_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Step 6: Build and push nginx image
      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./Project/nginx-nodejs-redis/nginx
          file: ./Project/nginx-nodejs-redis/nginx/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-nginx:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-nginx:${{ steps.release_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Step 7: Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # Step 8: Configure Kubernetes connection
      - name: Configure Kubernetes
        run: |
          mkdir -p $HOME/.kube
          # Write kubeconfig - try base64 decode first, then fallback to plain text
          KUBECONFIG_CONTENT="${{ secrets.KUBECONFIG }}"
          # Try base64 decode
          if echo "$KUBECONFIG_CONTENT" | base64 -d > $HOME/.kube/config 2>/dev/null; then
            echo "Kubeconfig decoded from base64"
          else
            # Use as plain text, but remove any surrounding quotes if present
            echo "$KUBECONFIG_CONTENT" | sed 's/^"//;s/"$//' > $HOME/.kube/config
            echo "Kubeconfig used as plain text"
          fi
          chmod 600 $HOME/.kube/config
          # Verify the config file format
          if ! grep -q "apiVersion:" $HOME/.kube/config 2>/dev/null; then
            echo "Error: kubeconfig file doesn't appear to be valid YAML"
            echo "First 500 characters:"
            head -c 500 $HOME/.kube/config
            exit 1
          fi
          kubectl version --client

      # Step 9: Verify Kubernetes cluster connection
      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # Step 10: Update web deployment with new image
      - name: Update web deployment
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-web:${{ steps.release_version.outputs.version }}"
          echo "Updating web deployment with image: $IMAGE"
          # Try kubectl set image first, fallback to patch if needed
          kubectl set image deployment/web web=$IMAGE -n ${{ env.KUBERNETES_NAMESPACE }} || \
          kubectl patch deployment web -n ${{ env.KUBERNETES_NAMESPACE }} -p '{"spec":{"template":{"spec":{"containers":[{"name":"web","image":"'$IMAGE'"}]}}}}'

      # Step 11: Update nginx deployment with new image
      - name: Update nginx deployment
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-nginx:${{ steps.release_version.outputs.version }}"
          echo "Updating nginx deployment with image: $IMAGE"
          # Try kubectl set image first, fallback to patch if needed
          kubectl set image deployment/nginx nginx=$IMAGE -n ${{ env.KUBERNETES_NAMESPACE }} || \
          kubectl patch deployment nginx -n ${{ env.KUBERNETES_NAMESPACE }} -p '{"spec":{"template":{"spec":{"containers":[{"name":"nginx","image":"'$IMAGE'"}]}}}}'

      # Step 12: Verify web deployment rollout
      - name: Verify web deployment rollout
        run: |
          echo "Waiting for web deployment to complete rollout..."
          kubectl rollout status deployment/web -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=300s
          echo "Web deployment rolled out successfully!"

      # Step 13: Verify nginx deployment rollout
      - name: Verify nginx deployment rollout
        run: |
          echo "Waiting for nginx deployment to complete rollout..."
          kubectl rollout status deployment/nginx -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=300s
          echo "Nginx deployment rolled out successfully!"

      # Step 14: Display deployment status
      - name: Display deployment status
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n ${{ env.KUBERNETES_NAMESPACE }}
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.KUBERNETES_NAMESPACE }}
          echo ""
          echo "=== Image Versions ==="
          kubectl get deployments -n ${{ env.KUBERNETES_NAMESPACE }} -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.spec.template.spec.containers[0].image}{"\n"}{end}'

      # Step 15: Verify pods are running
      - name: Verify pods are healthy
        run: |
          echo "Checking pod health..."
          kubectl wait --for=condition=ready pod -l app=web -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=120s || true
          kubectl wait --for=condition=ready pod -l app=nginx -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=120s || true
          echo "All pods are ready!"

