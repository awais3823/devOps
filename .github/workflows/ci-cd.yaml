name: CI/CD Pipeline

on:
  release:
    types: [published] # 'published' is more reliable than 'created'

env:
  DOCKER_REGISTRY: docker.io
  KUBERNETES_NAMESPACE: nginx-nodejs-redis

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Images
        uses: docker/build-push-action@v5
        with:
          context: ./Project/nginx-nodejs-redis/web
          file: ./Project/nginx-nodejs-redis/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-web:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-web:latest

      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./Project/nginx-nodejs-redis/nginx
          file: ./Project/nginx-nodejs-redis/nginx/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-nginx:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-nodejs-redis-nginx:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          # Create kubeconfig directory
          mkdir -p $HOME/.kube
          # Use printf to preserve formatting
          printf '%s' "$KUBECONFIG" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          
          # Validate kubeconfig
          if ! grep -q "apiVersion:" $HOME/.kube/config; then
            echo "Error: Invalid kubeconfig"
            exit 1
          fi
          
          TAG=${{ github.event.release.tag_name }}
          USER=${{ secrets.DOCKERHUB_USERNAME }}
          NS=${{ env.KUBERNETES_NAMESPACE }}

          # Verify cluster connection
          kubectl cluster-info

          # Update the images in the cluster
          kubectl set image deployment/web web=$USER/nginx-nodejs-redis-web:$TAG -n $NS
          kubectl set image deployment/nginx nginx=$USER/nginx-nodejs-redis-nginx:$TAG -n $NS
          
          # Wait for rollout to finish
          kubectl rollout status deployment/web -n $NS --timeout=300s
          kubectl rollout status deployment/nginx -n $NS --timeout=300s
          
          # Show status
          kubectl get pods -n $NS
