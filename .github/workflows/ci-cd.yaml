name: CI/CD Pipeline

on:
  release:
    types: [published]

env:
  KUBERNETES_NAMESPACE: nginx-nodejs-redis

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Web Image
        run: |
          TAG=${{ github.event.release.tag_name }}
          USER=${{ secrets.DOCKERHUB_USERNAME }}
          docker build -t $USER/nginx-nodejs-redis-web:$TAG -f ./Project/nginx-nodejs-redis/web/Dockerfile ./Project/nginx-nodejs-redis/web
          docker push $USER/nginx-nodejs-redis-web:$TAG
          docker tag $USER/nginx-nodejs-redis-web:$TAG $USER/nginx-nodejs-redis-web:latest
          docker push $USER/nginx-nodejs-redis-web:latest

      - name: Build and Push Nginx Image
        run: |
          TAG=${{ github.event.release.tag_name }}
          USER=${{ secrets.DOCKERHUB_USERNAME }}
          docker build -t $USER/nginx-nodejs-redis-nginx:$TAG -f ./Project/nginx-nodejs-redis/nginx/Dockerfile ./Project/nginx-nodejs-redis/nginx
          docker push $USER/nginx-nodejs-redis-nginx:$TAG
          docker tag $USER/nginx-nodejs-redis-nginx:$TAG $USER/nginx-nodejs-redis-nginx:latest
          docker push $USER/nginx-nodejs-redis-nginx:latest

      - name: Configure Kubernetes
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl config view --minify

      - name: Deploy to Kubernetes
        run: |
          TAG=${{ github.event.release.tag_name }}
          USER=${{ secrets.DOCKERHUB_USERNAME }}
          NS=${{ env.KUBERNETES_NAMESPACE }}
          
          kubectl set image deployment/web web=$USER/nginx-nodejs-redis-web:$TAG -n $NS
          kubectl set image deployment/nginx nginx=$USER/nginx-nodejs-redis-nginx:$TAG -n $NS
          kubectl rollout status deployment/web -n $NS --timeout=300s
          kubectl rollout status deployment/nginx -n $NS --timeout=300s
          kubectl get pods -n $NS
