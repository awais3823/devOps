apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.33.0 (3ce457399)
  labels:
    io.kompose.service: web
  name: web
spec:
  type: NodePort              # <-- Changed to NodePort
  ports:
    - name: "5000"
      port: 5000
      targetPort: 5000
      nodePort: 30080        # <-- Optional, Kubernetes can assign automatically if omitted
  selector:
    io.kompose.service: web

